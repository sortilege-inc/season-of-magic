<script>window.SHEET = {"id":"princess-hobnip","name":"Princess Hobnip","defaultEdition":"2024","portrait":"../company/img/princess-hobnip.webp","level":4,"classes":[{"name":"Fighter","subclass":"Arcane Archer","level":4}],"race":"Goliath","background":"Noble","abilities":{"str":13,"dex":18,"con":10,"int":16,"wis":8,"cha":12},"saveProf":["str","con"],"proficiencyBonus":2,"skills":{"arcana":1,"history":1,"investigation":1,"nature":1,"religion":1,"insight":1,"persuasion":1},"ac":16,"speed":30,"initiative":4,"senses":"Size Medium · Passive Perception 9","hp":{"max":31,"current":31,"temp":0},"hitDice":[{"size":"d10","total":4,"used":0}],"attacks":[{"name":"Longbow","ability":"dex","bonus":2,"damage":"1d8 MOD +2","damageType":"Piercing","range":"Range 150/600","mastery":{"name":"Slow","text":"If you hit a creature with this weapon and deal damage to it, you can reduce its Speed by 10 feet until the start of your next turn. If the creature is hit more than once by weapons that have this property, the Speed reduction doesn't exceed 10 feet."},"notes":"The Archery Fighting Style's +2 to hit and the Bracers of Archery's +2 to damage are both already included."},{"name":"Scimitar","ability":"dex","damage":"1d6 MOD","damageType":"Slashing","range":"Finesse, Light","mastery":{"name":"Nick","text":"When you make the extra attack of the Light property, you can make it as part of the Attack action instead of as a Bonus Action. You can make this extra attack only once per turn."}},{"name":"Shortsword","ability":"dex","damage":"1d6 MOD","damageType":"Piercing","range":"Finesse, Light","mastery":{"name":"Vex","text":"If you hit a creature with this weapon and deal damage to the creature, you have Advantage on your next attack roll against that creature before the end of your next turn."}}],"spellcasting":{"ability":"int","saveDC":13,"attackBonus":5,"slots":{},"spells":[{"name":"Prestidigitation","level":0,"prepared":true,"castTime":"Action","range":"10 feet","notes":"Transmutation cantrip · V, S · Duration up to 1 hour · from Arcane Archer Lore","text":"Transmutation cantrip. Casting Time: Action. Range: 10 feet. Components: V, S. Duration: Up to 1 hour.\n\nYou create a magical effect within range. Choose the effect from the options below. If you cast this spell multiple times, you can have up to three of its non-instantaneous effects active at a time.\n\nSensory Effect. You create an instantaneous, harmless sensory effect, such as a shower of sparks, a puff of wind, faint musical notes, or an odd odor.\n\nFire Play. You instantaneously light or snuff out a candle, a torch, or a small campfire.\n\nClean or Soil. You instantaneously clean or soil an object no larger than 1 cubic foot.\n\nMinor Sensation. You chill, warm, or flavor up to 1 cubic foot of nonliving material for 1 hour.\n\nMagic Mark. You make a color, a small mark, or a symbol appear on an object or a surface for 1 hour.\n\nMinor Creation. You create a nonmagical trinket or an illusory image that can fit in your hand. It lasts until the end of your next turn. A trinket can deal no damage and has no monetary worth."}]},"features":[{"name":"Fighting Style: Archery","source":"Class — Fighter","text":"Archery (already added)"},{"name":"Second Wind","source":"Class — Fighter","uses":{"max":3,"per":"short rest","used":0},"heal":"1d10+4","action":"bonus","text":"As a Bonus Action, you can regain 1d10 + 4 Hit Points. You can use this feature three times. You regain one expended use when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest."},{"name":"Weapon Mastery","source":"Class — Fighter","text":"Longbow, Scimitar, Shortsword, Shortbow (see PH or Basic Rules)"},{"name":"Action Surge","source":"Class — Fighter","uses":{"max":1,"per":"short rest","used":0},"text":"On your turn, you can take one additional action, except the Magic action. Once you use this feature, you can't do so again until you finish a Short or Long Rest."},{"name":"Tactical Mind","source":"Class — Fighter","text":"see PH or Basic Rules"},{"name":"Ability Score Improvement","source":"Class — Fighter","text":"Dexterity 16 → 18 (Fighter 4)."},{"name":"Arcane Archer Lore","source":"Class — Arcane Archer","text":"(already added)"},{"name":"Arcane Shot","source":"Class — Arcane Archer","uses":{"max":3,"per":"short rest","used":0},"text":"Arcane Shot Die d6, Saving Throw DC 13\n\nOnce per turn when you make an ranged attack using a weapon with the ammunition property, choose an Arcane Shot option to apply. Use 3 times, regaining all uses after a Short or Long Rest."},{"name":"Beguiling Shot","source":"Arcane Shot option","roll":"2d6","text":"When you hit a creature with this Arcane Shot, it takes an extra 2d6 Psychic damage and must succeed on a DC 13 Wisdom saving throw or have the Charmed condition until the start of you next turn, treating either you or one of your allies within 30 ft. of the target (your choice) as the charmer. The Charmed condition ends early if the charmer attacks the target, deals damage to it, or forces it to make a saving throw."},{"name":"Enfeebling Shot","source":"Arcane Shot option","roll":"2d6","text":"The creature you hit takes an extra 2d6 Necrotic damage and must make a DC 13 Constitution saving throw. On a failed save, it has the Poisoned condition until the end of its next turn. Whenever a target Poisoned in this way hits with an attack roll, it subtracts 1d6 from the total damage of that attack."},{"name":"Giant Ancestry (Fire Giant) — Fire's Burn","source":"Species — Goliath","uses":{"max":2,"per":"long rest","used":0},"roll":"1d10","text":"When you hit a target with an attack roll and deal damage to it, you can also deal 1d10 Fire damage to that target. Use twice, and regain all uses after a Long Rest."},{"name":"Powerful Build","source":"Species — Goliath","text":"You have Advantage on any ability check you make to end the Grappled condition. You also count as one size larger when determining your carrying capacity."}],"feats":[{"name":"Skilled","text":"(already added)"}],"proficiencies":{"armor":"Light, Medium, Heavy, Shields","weapons":"Martial Weapons, Simple Weapons","tools":"Bagpipes, Disguise Kit, Gaming Set (dragonchess)","languages":"Common, Elvish, Giant"},"equipment":[{"name":"Bracers of Archery","notes":"Wondrous item, uncommon (requires attunement) — attuned. While wearing these bracers, you have proficiency with the longbow and shortbow, and you gain a +2 bonus to damage rolls on ranged attacks made with such weapons."},{"name":"Studded Leather"},{"name":"Longbow"},{"name":"Scimitar"},{"name":"Shortsword"},{"name":"Quiver with 40 Arrows"},{"name":"Disguise Kit"},{"name":"Gaming Set (dragonchess)"},{"name":"Fine Clothes"},{"name":"Perfume"},{"name":"Dungeoneer's Pack","notes":"Backpack, Caltrops, Crowbar, 2 flasks of Oil, 10 days of Rations, Rope, Tinderbox, 10 Torches, Waterskin"},{"name":"Potion of Healing","notes":"see PH or Basic Rules"}],"currency":{"gp":200},"conditions":[],"notes":"Transcribed from the two pages of the official 2024 character sheet in season-of-magic-support/build/sheets/ (princess-1.jpg, princess-2.jpg), then advanced to Fighter 4 after session 2: rolled 9 hit points, Ability Score Improvement spent on +2 Dexterity, Weapon Mastery raised to four weapons with Shortbow added, Second Wind to three uses, and Bracers of Archery attuned.\n\nSecond Wind's and Weapon Mastery's wording here is the level-3 sheet's own text with the level-derived numbers advanced (twice → three times, 1d10+3 → 1d10+4); the Fighter progression that drives those is from the 2024 SRD corpus. Weapon-mastery property text (Slow, Nick, Vex) is verbatim 2024 property text. Heroic Inspiration and death saves were blank on the sheet.","pronouns":"he/him"};</script>
